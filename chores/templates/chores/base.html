{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Household chores{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'chores/app.css' %}">
  <script>
    const savedTheme = localStorage.getItem("chores-theme");
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  </script>
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <a class="brand" href="{% url 'chores:chore_list' %}">
        <span class="brand-mark">✓</span>
        <span><strong>Household</strong><small>Chores command center</small></span>
      </a>
      <nav class="site-nav">
        {% if user.is_authenticated %}<a href="{% url 'chores:household' %}">Household</a>{% endif %}
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode" onclick="toggleTheme()"><span id="theme-icon">◐</span><span id="theme-label">Dark mode</span></button>
        {% if user.is_authenticated %}<a class="logout-link" href="{% url 'chores:logout' %}">Log out</a>{% endif %}
      </nav>
    </header>
    {% block content %}{% endblock %}
  </main>
  <script>
    function updateThemeLabel() {
      const dark = document.documentElement.dataset.theme === "dark";
      document.getElementById("theme-label").textContent = dark ? "Light mode" : "Dark mode";
      document.getElementById("theme-icon").textContent = dark ? "☼" : "◐";
    }
    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem("chores-theme", nextTheme);
      updateThemeLabel();
    }
    updateThemeLabel();
  </script>
</body>
</html>
