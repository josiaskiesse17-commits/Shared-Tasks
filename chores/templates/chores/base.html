{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Household chores{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'chores/app.css' %}">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <a class="brand" href="{% url 'chores:chore_list' %}">Household chores</a>
      {% if user.is_authenticated %}<a href="{% url 'chores:logout' %}">Log out</a>{% endif %}
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
